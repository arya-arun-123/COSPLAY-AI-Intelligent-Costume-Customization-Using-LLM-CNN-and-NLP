services:

  db:
    image: pgvector/pgvector:pg18
    container_name: cosplay_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: MINNU
      POSTGRES_DB: Cosplay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  server:
    build:
      context: ./front-end/server
    container_name: cosplay_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://postgres:MINNU@db:5432/Cosplay?schema=public
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - db

  ai-backend:
    build:
      context: ./back-end
    container_name: cosplay_ai_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: development
      PORT: 8000
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      DATABASE_URL: postgresql://postgres:MINNU@db:5432/Cosplay?schema=public
    depends_on:
      - db

  client:
    build:
      context: ./front-end/client
    container_name: cosplay_client
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - server
      - ai-backend

volumes:
  postgres_data: